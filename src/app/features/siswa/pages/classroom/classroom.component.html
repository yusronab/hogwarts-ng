<div class="space-y-6">
  <section class="space-y-6">
    <div>
      <h2>Mata Pelajaran</h2>
      <p>Cek kehadiran kamu disetiap mata pelajaran.</p>
    </div>

    @if (subjects(); as subjects) {
      <div class="scroll">
        @for (item of subjects; track $index) {
          <app-card-subject [subject]="item" />
        }
      </div>
    }
  </section>

  <section class="space-y-6">
    <h2>Detail Pelajaran</h2>
    <div>
      <app-table-attendance />
    </div>
  </section>
</div>
